# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
# starter_v0 — tool declarations (Optimized for v2/v3 Routing & Arg Accuracy)

tools:
  - name: deduplicate
    description: "Remove duplicate URLs from already-provided articles or posts before formatting a digest. Keep the first item per exact URL after trimming whitespace. Use only when deduplication is requested; does not search, fetch, or merge similar content."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Existing articles or posts; every item must have a non-empty HTTP(S) URL."
          items:
            type: object
            properties:
              url: {type: string}
              title: {type: string}
              summary: {type: string}
              source: {type: string}
            required: [url]
      required: [items]
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Ask for missing essential information or explicit confirmation before an external action.
      WHEN TO USE: Use when a request lacks critical information, or use response_type=yes_no before sending/publishing even when all content is available.
      WHEN NOT TO USE: Do NOT use if all required parameters are provided or if the question is out of scope.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The specific question to ask the user to clarify missing information."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Format of the expected answer from user."}
        options: {type: array, default: [], items: {type: string}, description: "List of choices if response_type is 'choice'."}
      required: [question]

  - name: timeline
    description: >-
      Retrieve recent posts or tweets from a specific social account or user handle.
      WHEN TO USE: Use when the user specifically requests recent tweets/posts from a named account (e.g., @sama, @elonmusk).
      WHEN NOT TO USE: Do NOT use to search social posts by keywords or topics (use `social_search` instead). Do NOT use if no user handle/screenname is specified (call `clarify` first).
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter/X handle or username WITHOUT the '@' symbol (e.g., 'sama', 'elonmusk')."}
        limit: {type: integer, default: 5, description: "Number of recent posts to fetch."}
      required: [screenname]

  - name: social_search
    description: >-
      Search social media posts or tweets by keywords, topics, or hashtags.
      WHEN TO USE: Use when searching for recent posts/tweets matching general keywords, topics, or trends across social media.
      WHEN NOT TO USE: Do NOT use when fetching timeline posts of a specific user handle (use `timeline` instead). Do NOT use for general web search (use `lookup` instead).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword or query string to search for."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sort order: 'Latest' for recent posts or 'Top' for popular posts."}
        limit: {type: integer, default: 5, description: "Maximum number of posts to return."}
      required: [query]

  - name: lookup
    description: >-
      Perform a web search for general information or online news articles.
      WHEN TO USE: Use when searching the web for information, current news, facts, or articles. Set `topic="news"` when searching specifically for recent news items.
      WHEN NOT TO USE: Do NOT use to search social media posts or tweets (use `social_search` instead). Do NOT use to fetch full contents of a specific URL (use `fetch` instead).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query string."}
        topic: {type: string, enum: [general, news], default: "general", description: "Search topic category: set to 'news' for current news searches, otherwise 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time range filter for search results."}
        max_results: {type: integer, default: 5, description: "Maximum number of search results."}
      required: [query]

  - name: fetch
    description: >-
      Fetch and extract the full Markdown content from a specific web URL.
      WHEN TO USE: Use when the user explicitly provides a full web URL (http:// or https://) to read, summarize, or extract text from.
      WHEN NOT TO USE: Do NOT use if no explicit URL is provided in the request (call `clarify` instead). Do NOT use for general web searching (use `lookup` instead).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Complete URL starting with http:// or https://."}
      required: [url]

  - name: format
    description: >-
      Format a structured list of collected research items into a clean Markdown digest or summary.
      WHEN TO USE: Use to compile and format already retrieved research items into markdown lists, sections, or daily briefs.
      WHEN NOT TO USE: Do NOT use to search or fetch data from external networks.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of research items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Formatting template."}
        headline: {type: string, default: "", description: "Digest title or header text."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Publish or send a text message to a Telegram channel.
      WHEN TO USE: Use ONLY when the user explicitly requests to send/post a message AND has provided explicit confirmation (`confirmed=true`).
      WHEN NOT TO USE: NEVER invoke if `confirmed` is false or missing, or if user hasn't explicitly consented to sending.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text content to be published/sent."}
        confirmed: {type: boolean, default: false, description: "Safety flag: MUST be explicitly set to true by user consent before sending."}
      required: [text]

  - name: policy
    description: >-
      Search internal company compliance and AI usage policy documents.
      WHEN TO USE: Use when answering questions about internal guidelines, data privacy, AI research standards, or citation policies.
      WHEN NOT TO USE: Do NOT use for public web search or external academic papers.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy search query."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Specific policy domain filter."}
        top_k: {type: integer, default: 3, description: "Maximum number of policy passages."}
      required: [query]

  - name: papers
    description: >-
      Search academic scientific papers on arXiv.
      WHEN TO USE: Use when searching for academic research papers, preprint literature, or arXiv studies by topic/author.
      WHEN NOT TO USE: Do NOT use for general web news (use `lookup`) or social media posts (use `social_search`).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Academic search query or paper topic."}
        max_results: {type: integer, default: 5, description: "Maximum number of paper metadata results."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort criteria."}
      required: [query]

  - name: paper_text
    description: >-
      Download and extract full text content from an arXiv paper PDF.
      WHEN TO USE: Use when analyzing or reading the full text of a specific arXiv paper given its arXiv ID or URL.
      WHEN NOT TO USE: Do NOT use for general website URLs (use `fetch` instead).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID (e.g., '2301.12345') or full arXiv URL."}
        max_pages: {type: integer, default: 5, description: "Maximum number of PDF pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Character limit for extracted text."}
      required: [arxiv_url]

  - name: stock_quote
    description: >-
      Return STATIC DEMO quote data for AAPL, NVDA, or VHM; this is not live market data.
      WHEN TO USE: Only for explicit requests for sample/demo stock data. Always disclose is_demo=true.
      WHEN NOT TO USE: Do NOT use for current market prices or real investment decisions. Unknown symbols return an error without a price.
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "", description: "Stock ticker symbol (e.g., AAPL, NVDA)."}
      required: [symbol]
